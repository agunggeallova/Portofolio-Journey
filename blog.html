<!doctype html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Journal — Bagas Ady</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><style>
:root{--bg:#080a0d;--surface:#0d110e;--paper:#eef2ed;--lime:#c6ff44;--line:rgba(238,242,237,.14);--muted:#89948c;--display:"Space Grotesk",sans-serif;--sans:Manrope,sans-serif;--mono:"DM Mono",monospace}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--paper);font-family:var(--sans)}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 84% 0,rgba(198,255,68,.1),transparent 27%),linear-gradient(rgba(198,255,68,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(198,255,68,.025) 1px,transparent 1px);background-size:auto,60px 60px,60px 60px;mask-image:linear-gradient(#000,transparent 62%)}a{color:inherit;text-decoration:none}.shell{width:min(1200px,calc(100% - 42px));margin:auto}.nav{height:82px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;transition:.35s}.nav.scrolled{height:64px;background:rgba(8,10,13,.82);backdrop-filter:blur(18px) saturate(145%);border-color:rgba(198,255,68,.28);box-shadow:0 12px 34px rgba(0,0,0,.24)}.logo{font:700 19px var(--display);letter-spacing:-.07em}.logo span,.lime{color:var(--lime)}.nav-right{display:flex;gap:24px;align-items:center;font:10px var(--mono);letter-spacing:.08em}.nav-right a:hover{color:var(--lime)}.admin{border:1px solid rgba(198,255,68,.55);padding:9px 11px;color:var(--lime)}.hero{padding:78px 0 47px;display:grid;grid-template-columns:1fr 260px;gap:30px;align-items:end;border-bottom:1px solid var(--line);position:relative}.eyebrow,.meta{font:10px var(--mono);letter-spacing:.1em;color:var(--lime)}.eyebrow:before{content:"◈";padding-right:8px}h1{font:600 clamp(3.7rem,8vw,7.2rem)/.84 var(--display);letter-spacing:-.09em;margin:20px 0 0}.hero p{color:#aab4ac;font-size:14px;line-height:1.75;margin:0}.hero-stat{border-left:1px solid var(--line);padding-left:23px}.hero-stat b{display:block;font:600 3rem/.9 var(--display);letter-spacing:-.08em;color:var(--lime)}.hero-stat span{display:block;margin-top:11px;color:var(--muted);font:9px var(--mono);letter-spacing:.08em}.journal{padding:35px 0 100px}.filterbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px}.filters{display:flex;gap:8px;overflow:auto}.filter{border:1px solid var(--line);background:transparent;color:var(--muted);padding:8px 10px;font:9px var(--mono);letter-spacing:.08em}.filter.active,.filter:hover{color:var(--bg);background:var(--lime);border-color:var(--lime)}.count{color:var(--muted);font:9px var(--mono);letter-spacing:.08em}.featured{display:grid;grid-template-columns:1.22fr .78fr;background:var(--surface);border:1px solid var(--line);min-height:430px;transition:.35s}.featured:hover{border-color:rgba(198,255,68,.5);box-shadow:0 15px 55px rgba(0,0,0,.25)}.featured-img{width:100%;height:100%;min-height:320px;object-fit:cover;filter:saturate(.78) contrast(1.05)}.featured-copy{padding:38px;display:flex;flex-direction:column}.featured h2{font:600 clamp(2rem,3.5vw,3.5rem)/.95 var(--display);letter-spacing:-.075em;margin:24px 0 19px}.excerpt{color:#a7b0a9;font-size:13px;line-height:1.75;margin:0}.read{font:10px var(--mono);letter-spacing:.09em;margin-top:auto;color:var(--paper)}.read span{color:var(--lime);font-size:16px;margin-left:5px}.section-title{margin:68px 0 19px;display:flex;justify-content:space-between;align-items:center}.section-title h3{font:600 19px var(--display);letter-spacing:-.05em;margin:0}.feed{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card{background:var(--surface);border:1px solid var(--line);padding:0 22px 22px;min-height:315px;display:flex;flex-direction:column;transition:.3s}.card:hover{transform:translateY(-6px);border-color:rgba(198,255,68,.55)}.card-img{width:calc(100% + 44px);height:145px;object-fit:cover;margin:0 -22px 19px;filter:saturate(.72)}.card h3{font:600 1.45rem/1.06 var(--display);letter-spacing:-.06em;margin:15px 0}.card .excerpt{font-size:12px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.empty{grid-column:1/-1;border:1px dashed var(--line);padding:50px;text-align:center;color:var(--muted);font:11px var(--mono)}.error{color:#ff9696}.article{max-width:820px;padding:75px 0 120px}.article .back{font:10px var(--mono);color:var(--lime);letter-spacing:.09em}.article .meta{margin-top:45px}.article h1{font-size:clamp(3.1rem,6.5vw,6.5rem);margin:17px 0 32px}.article-cover{width:100%;max-height:500px;object-fit:cover;border:1px solid var(--line);margin-bottom:36px}.article-content{white-space:pre-wrap;color:#c2cbc4;line-height:1.95;font-size:16px}.hidden{display:none}@media(max-width:720px){.shell{width:min(100% - 30px,1200px)}.nav{height:68px}.nav-right a:not(.admin){display:none}.admin{padding:8px}.hero{grid-template-columns:1fr;padding:55px 0 37px}.hero-stat{border:0;padding:0}.featured{grid-template-columns:1fr}.featured-img{height:225px;min-height:0}.featured-copy{padding:26px;min-height:305px}.feed{grid-template-columns:1fr}.journal{padding-bottom:70px}.hero p{margin-top:5px}.filterbar{gap:12px}.count{white-space:nowrap}}@media(max-width:390px){.shell{width:calc(100% - 24px)}.logo{font-size:17px}.admin{font-size:0;padding:12px}.admin:after{content:"◈";font-size:13px}.hero{padding-top:42px}h1{font-size:3.35rem}.featured-copy{padding:20px}.featured h2{font-size:1.8rem}.section-title{margin-top:45px}.section-title .count{display:none}.article{padding-top:48px}.article-content{font-size:15px}}
</style></head><body><div class="shell"><nav class="nav"><a class="logo" href="index.html">BAGAS<span>/</span>ADY</a><div class="nav-right"><a href="index.html">← PORTFOLIO</a><a href="admin.html" class="admin">WRITER CONSOLE ↗</a></div></nav></div><main id="feed-view"><section class="shell hero"><div><div class="eyebrow">SIGNAL / RESEARCH / CULTURE</div><h1>THE<br><span class="lime">JOURNAL.</span></h1></div><div class="hero-stat"><b id="post-count">—</b><span>PUBLISHED<br>TRANSMISSIONS</span><p>Catatan tentang komunitas, crypto, dan masa depan internet terbuka.</p></div></section><section class="shell journal"><div class="filterbar"><div class="filters"><button class="filter active" data-filter="ALL">ALL</button><button class="filter" data-filter="WEB3">WEB3</button><button class="filter" data-filter="COMMUNITY">COMMUNITY</button><button class="filter" data-filter="RESEARCH">RESEARCH</button></div><span class="count" id="filter-count">LOADING...</span></div><div id="featured"></div><div class="section-title"><h3>Latest <span class="lime">signals.</span></h3><span class="count">CURATED BY BAGAS</span></div><div class="feed" id="feed"><div class="empty">MEMUAT TRANSMISSIONS...</div></div></section></main><main id="article-view" class="hidden"><div class="shell article" id="article"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script><script>
const configured=!window.SUPABASE_URL.includes('PASTE_')&&!window.SUPABASE_ANON_KEY.includes('PASTE_'),$=s=>document.querySelector(s),esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])),date=v=>new Intl.DateTimeFormat('id-ID',{day:'2-digit',month:'short',year:'numeric'}).format(new Date(v));let posts=[],active='ALL';const card=p=>`<a class="card" href="blog.html?post=${encodeURIComponent(p.slug)}">${p.cover_url?`<img class="card-img" src="${esc(p.cover_url)}" alt="">`:''}<div class="meta">${esc(p.category||'WEB3')} / ${date(p.published_at)}</div><h3>${esc(p.title)}</h3><p class="excerpt">${esc(p.excerpt||'')}</p><span class="read">READ MORE <span>↗</span></span></a>`;function render(){const showing=active==='ALL'?posts:posts.filter(p=>(p.category||'').toUpperCase()===active);$('#filter-count').textContent=`${showing.length} SIGNAL${showing.length===1?'':'S'}`;$('#post-count').textContent=posts.length;const lead=showing[0];$('#featured').innerHTML=lead?`<a class="featured" href="blog.html?post=${encodeURIComponent(lead.slug)}"><div>${lead.cover_url?`<img class="featured-img" src="${esc(lead.cover_url)}" alt="">`:''}</div><div class="featured-copy"><div class="meta">FEATURED / ${esc(lead.category||'WEB3')} / ${date(lead.published_at)}</div><h2>${esc(lead.title)}</h2><p class="excerpt">${esc(lead.excerpt||'')}</p><span class="read">EXPLORE ARTICLE <span>↗</span></span></div></a>`:'<div class="empty">BELUM ADA ARTIKEL PADA KATEGORI INI.</div>';$('#feed').innerHTML=showing.slice(1).map(card).join('')||'<div class="empty">MORE SIGNALS ARE COMING SOON.</div>'}async function load(){if(!configured){$('#feed').innerHTML='<div class="empty">SUPABASE BELUM TERHUBUNG.</div>';return}const db=supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY),slug=new URLSearchParams(location.search).get('post');if(slug){$('#feed-view').classList.add('hidden');$('#article-view').classList.remove('hidden');const {data,error}=await db.from('posts').select('*').eq('slug',slug).eq('status','published').single(),target=$('#article');if(error||!data){target.innerHTML='<a class="back" href="blog.html">← BACK TO JOURNAL</a><h1>Signal not found.</h1>';return}target.innerHTML=`<a class="back" href="blog.html">← ALL SIGNALS</a><div class="meta">${esc(data.category||'WEB3')} / ${date(data.published_at)}</div><h1>${esc(data.title)}</h1>${data.cover_url?`<img class="article-cover" src="${esc(data.cover_url)}" alt="">`:''}<div class="article-content">${esc(data.content)}</div>`;return}const {data,error}=await db.from('posts').select('*').eq('status','published').order('published_at',{ascending:false});if(error){$('#feed').innerHTML=`<div class="empty error">${esc(error.message)}</div>`;return}posts=data;render()}document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelector('.filter.active').classList.remove('active');b.classList.add('active');active=b.dataset.filter;render()});const nav=$('.nav');addEventListener('scroll',()=>nav.classList.toggle('scrolled',scrollY>24),{passive:true});load();
</script></body></html>
