<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CikSwap</title><style>body{margin:0;background:#080a0d;color:#edf1eb;font-family:Arial}.app{max-width:620px;margin:8vh auto;padding:25px;border:1px solid #35402f;background:#0d110e}h1{font-size:54px;margin:0}b{color:#c6ff44}input,select,button{box-sizing:border-box;width:100%;margin-top:12px;padding:15px;background:#101710;border:1px solid #35402f;color:white}button{background:#c6ff44;color:#071007;font-weight:bold}.row{display:flex;gap:10px}.row>*{width:50%}small{color:#9aa59c}.quote{margin-top:18px;padding:16px;border:1px solid #35402f;line-height:1.8}.ok{color:#c6ff44}.err{color:#ff9696}</style></head><body><main class="app"><small>◈ LI.FI MULTI-CHAIN AGGREGATOR</small><h1>CIK<b>SWAP</b></h1><p>Connect wallet → enter amount → auto estimate → confirm in MetaMask.</p><button id="connect">CONNECT WALLET</button><div class="row"><select id="chain"><option value="56">BNB Smart Chain</option><option value="1">Ethereum</option><option value="137">Polygon</option><option value="8453">Base</option></select><select id="token"><option value="NATIVE">BNB / native</option><option value="USDC">USDC</option></select></div><input id="amount" placeholder="Amount to swap" inputmode="decimal"><div class="quote" id="quote">Enter amount to get estimate.</div><button id="confirm" disabled>CONFIRM SWAP</button></main><script>const C={1:{n:'ETH',u:'0xA0b86991c6218b36c1d19d4a2e9eb0ce3606eb48'},56:{n:'BNB',u:'0x8AC76a51cc950d9822d68b83fe1ad97b32cd580d'},137:{n:'POL',u:'0x3c499c542cef5e3811e1192ce70d8cc03d5c3359'},8453:{n:'ETH',u:'0x833589fcd6edb6e08f4c7c32d4f71b54bda02913'}},N='0x0000000000000000000000000000000000000000';let account,route;const $=x=>document.querySelector(x);async function estimate(){if(!account||!amount.value)return;let c=C[chain.value],from=token.value==='NATIVE'?N:c.u,to=token.value==='NATIVE'?c.u:N,dec=token.value==='USDC'?6:18,a=BigInt(Math.floor(+amount.value*10**dec));quote.textContent='Finding best LI.FI route...';let r=await fetch(`/api/lifi/quote?fromChain=${chain.value}&toChain=${chain.value}&fromToken=${from}&toToken=${to}&fromAmount=${a}&fromAddress=${account}`),j=await r.json();if(!r.ok){quote.className='quote err';quote.textContent=j.error;return}route=j;let out=Number(j.estimate.toAmount)/10**(j.action.toToken.decimals||18);quote.className='quote ok';quote.textContent=`Estimated receive: ${out.toLocaleString()} ${j.action.toToken.symbol}`;confirm.disabled=false}connect.onclick=async()=>{account=(await ethereum.request({method:'eth_requestAccounts'}))[0];connect.textContent=account.slice(0,6)+'...'+account.slice(-4);estimate()};amount.oninput=()=>{clearTimeout(window.t);window.t=setTimeout(estimate,500)};chain.onchange=estimate;token.onchange=estimate;confirm.onclick=async()=>{if(!route)return;try{await ethereum.request({method:'eth_sendTransaction',params:[route.transactionRequest]});quote.textContent='Transaction sent.'}catch(e){quote.textContent=e.message;quote.className='quote err'}}</script></body></html>
