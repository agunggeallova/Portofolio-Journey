<!doctype html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Market Terminal</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet"><style>:root{--b:#080a0d;--p:#edf1eb;--l:#c6ff44;--line:#29302a;--m:#89938b;--f:"Space Grotesk",sans-serif;--mono:"DM Mono",monospace}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--p);font-family:Manrope,sans-serif}.shell{width:min(1200px,calc(100% - 36px));margin:auto}.nav{height:78px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(8,10,13,.86);backdrop-filter:blur(14px);z-index:2}.logo{font:700 19px var(--f)}.logo b,.lime{color:var(--l)}a{text-decoration:none;color:inherit}.nav a+ a{margin-left:20px;font:10px var(--mono);color:var(--m)}.hero{padding:70px 0 30px;display:flex;justify-content:space-between;align-items:end;gap:20px}.ey{color:var(--l);font:10px var(--mono);letter-spacing:.1em}.hero h1{font:700 clamp(3.4rem,8vw,7rem)/.8 var(--f);letter-spacing:-.09em;margin:18px 0 0}.status{border:1px solid var(--line);padding:12px;color:var(--m);font:10px var(--mono)}.tools{display:flex;gap:10px;border:1px solid var(--line);padding:10px}.tools input{flex:1;min-width:0;background:#0d110e;border:1px solid var(--line);padding:13px;color:var(--p)}button{background:var(--l);border:0;padding:12px 15px;font:10px var(--mono);font-weight:bold}.table{margin:22px 0 80px;border:1px solid var(--line);overflow:auto}table{width:100%;min-width:720px;border-collapse:collapse}th,td{padding:17px 14px;text-align:left;border-bottom:1px solid var(--line)}th{font:9px var(--mono);color:var(--m)}td{font-size:13px}tr:hover{background:#111711}.coin{display:flex;gap:10px;align-items:center;font-weight:bold}.icon{width:29px;height:29px;display:grid;place-items:center;border-radius:50%;background:#182214;color:var(--l);font:10px var(--mono)}.sym,.rank{color:var(--m);font:10px var(--mono)}.up{color:var(--l)}.down,.error{color:#ff9696}.empty{padding:55px;text-align:center;color:var(--m);font:11px var(--mono)}@media(max-width:600px){.shell{width:calc(100% - 26px)}.nav{height:64px}.nav a:first-child+ a{display:none}.hero{padding-top:50px;display:block}.status{margin-top:25px}.table{margin-left:-13px;margin-right:-13px}.hero h1{font-size:3.2rem}}</style></head><body><div class="shell"><nav class="nav"><a class="logo" href="index.html">BAGAS<b>/</b>ADY</a><span><a href="index.html">← PORTFOLIO</a><a href="blog.html">JOURNAL</a></span></nav><section class="hero"><div><div class="ey">◈ LIVE / COINMARKETCAP DATA</div><h1>MARKET<br><span class="lime">TERMINAL.</span></h1></div><div id="status" class="status">SOURCE: COINMARKETCAP<br>STATUS: CONNECTING...</div></section><div class="tools"><input id="search" placeholder="Cari BTC, ETH, SOL..."><button id="refresh">REFRESH ↻</button></div><div class="table"><table><thead><tr><th>#</th><th>ASSET</th><th>PRICE</th><th>24H</th><th>MARKET CAP</th><th>VOLUME 24H</th></tr></thead><tbody id="rows"><tr><td class="empty" colspan="6">MEMUAT MARKET DATA...</td></tr></tbody></table></div></div><script>const rows=document.querySelector('#rows'),search=document.querySelector('#search'),status=document.querySelector('#status');let coins=[];const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:n<1?6:2}).format(n||0),short=n=>new Intl.NumberFormat('en-US',{notation:'compact',maximumFractionDigits:2}).format(n||0);function draw(){let q=search.value.toLowerCase(),list=coins.filter(c=>c.name.toLowerCase().includes(q)||c.symbol.toLowerCase().includes(q));rows.innerHTML=list.length?list.map(c=>{let d=c.quote.USD,x=d.percent_change_24h||0;return `<tr><td class="rank">${c.cmc_rank}</td><td><div class="coin"><i class="icon">${c.symbol.slice(0,2)}</i>${c.name} <span class="sym">${c.symbol}</span></div></td><td>${money(d.price)}</td><td class="${x>=0?'up':'down'}">${x>=0?'+':''}${x.toFixed(2)}%</td><td>${short(d.market_cap)}</td><td>${short(d.volume_24h)}</td></tr>`}).join(''):'<tr><td class="empty" colspan="6">TOKEN TIDAK DITEMUKAN.</td></tr>'}async function load(){status.innerHTML='SOURCE: COINMARKETCAP<br>STATUS: SYNCING...';try{let r=await fetch('/api/market?limit=100'),j=await r.json();if(!r.ok)throw Error(j.error);coins=j.data;status.innerHTML=`SOURCE: COINMARKETCAP<br>STATUS: <b class="lime">LIVE / ${new Date().toLocaleTimeString('id-ID')}</b>`;draw()}catch(e){status.innerHTML=`SOURCE: COINMARKETCAP<br>STATUS: <b class="error">${e.message}</b>`;rows.innerHTML='<tr><td class="empty error" colspan="6">ATUR CMC_API_KEY PADA DEPLOYMENT VERCEL.</td></tr>'}}search.oninput=draw;refresh.onclick=load;load()</script></body></html>
